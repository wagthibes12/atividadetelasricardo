<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela Inicial Gestor</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div class="dashboard-layout">
  <!-- Barra Lateral -->
  <aside class="sidebar" aria-label="Menu Principal">
    <nav class="sidebar-nav">
      <ul class="sidebar-list">
        <li class="sidebar-item"><a href="#" class="sidebar-link active">Dashboard</a></li>
        <li class="sidebar-item"><a href="#" class="sidebar-link">Solicitações</a></li>
        <li class="sidebar-item"><a href="#" class="sidebar-link">Empréstimos</a></li>
        <li class="sidebar-item"><a href="#" class="sidebar-link">Equipamentos</a></li>
        <li class="sidebar-item"><a href="#" class="sidebar-link">Relatórios</a></li>
      </ul>
    </nav>
  </aside>

  
  <main class="main-content">
    
    <header class="content-header">
      <h1 class="page-title">Gestor</h1>
      <div class="user-profile">
        <span class="profile-label">Foto do perfil</span>
        <div class="profile-avatar" aria-label="Avatar do usuário">👤</div>
      </div>
    </header>

   
    <section class="metrics-grid" aria-label="Métricas do Sistema">
      <div class="metric-card metric-card-highlight">
        <h2 class="metric-title">Dashboard</h2>
      </div>
      
      <div class="metric-card">
        <span class="metric-label">Solicitações Pendentes</span>
        <span class="metric-value">5</span>
      </div>

      <div class="metric-card">
        <span class="metric-label">Empréstimos Ativos</span>
        <span class="metric-value">12</span>
      </div>

      <div class="metric-card">
        <span class="metric-label">Equipamentos Disponíveis</span>
        <span class="metric-value">28</span>
      </div>

      <div class="metric-card">
        <span class="metric-label">Equipamentos em Manutenção</span>
        <span class="metric-value">3</span>
      </div>
    </section>

    
    <section class="requests-section" aria-label="Solicitações Recentes">
      <h3 class="section-title">Solicitações Recentes</h3>
      <div class="requests-box">
        <p>Lista com as solicitações para ser aprovadas</p>
      </div>
    </section>
  </main>
</div>

</body>
</html>
