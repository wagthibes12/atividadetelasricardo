
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Usuários - Instituto Inova</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body class="login-page">

    <main class="login-card">

        <header class="login-header">
            <h1>Instituto Inova</h1>
            <p>Cadastro de Usuários</p>
        </header>

        <form class="login-form" id="formCadastro">

            <div class="form-group">
                <label for="nome_completo">Nome completo</label>
                <input
                    type="text"
                    id="nome_completo"
                    required
                    minlength="3"
                    maxlength="100"
                >
            </div>

            <div class="form-group">
                <label for="documento">Documento</label>
                <input
                    type="text"
                    id="documento"
                    required
                    minlength="5"
                    maxlength="20"
                >
            </div>

            <div class="form-group">
                <label for="email">E-mail</label>
                <input
                    type="email"
                    id="email"
                    required
                    maxlength="100"
                >
            </div>

            <div class="form-group">
                <label for="curso">Curso</label>
                <input
                    type="text"
                    id="curso"
                    maxlength="100"
                >
            </div>

            <div class="form-group">
                <label for="senha">Senha</label>
                <input
                    type="password"
                    id="senha"
                    required
                    minlength="8"
                    maxlength="128"
                >
            </div>

            <div class="form-group">
                <label for="perfil_id">Perfil</label>
                <select id="perfil_id" required>
                    <option value="">GESTOR</option>
                    <option value="">ADMIN</option>
                    <option value="">DISCENTE</option>
                </select>
            </div>

            <button
                id="btnCadastrar"
                class="btn-login"
                type="submit"
            >
                Cadastrar Usuário
            </button>

        </form>

        <p>
            <a href="login.html">Voltar para o login</a>
        </p>

        <p id="mensagem"></p>

    </main>
    <script>
        const formCadastro = document.getElementById("formCadastro");
        
        const btn_cadastrar = document.getElementById("btnCadastrar");
        btn_cadastrar.addEventListener("click",(ev)=>{
            ev.preventDefault();
            const nome_completo = document.getElementById("nome_completo").value;
            const documento = document.getElementById("documento").value;
            const email = document.getElementById("email").value;
            const curso = document.getElementById("curso").value;
            const senha = document.getElementById("senha").value;
            const perfil = document.getElementById("perfil_id").value;
            console.log(nome_completo)

        })







         











    </script>
    



</body>
</html>
